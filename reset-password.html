<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>設定新密碼｜土地測量資料分享系統</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./css/auth.css" />
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <h1>設定新密碼</h1>
            <p>請輸入至少六個字元的新密碼。</p>
            <form id="resetForm">
                <label>新密碼<input id="newPassword" type="password" minlength="6" autocomplete="new-password" required /></label>
                <label>再次輸入<input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required /></label>
                <button id="resetButton" class="auth-button" type="submit">儲存新密碼</button>
            </form>
            <div id="authMessage" role="status">正在確認重設連結…</div>
            <a class="auth-link" href="./login.html">返回登入頁</a>
        </section>
    </main>
    <script type="module" src="./js/reset-password.js"></script>
</body>
</html>
