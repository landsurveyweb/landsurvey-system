<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>會員管理｜土地測量資料分享系統</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./css/admin.css" />
</head>
<body>
    <main class="admin-page">
        <header><div><h1>會員管理</h1><p>帳號與密碼由管理員統一建立及管理。</p></div><a href="./">返回地圖</a></header>
        <form id="createMemberForm" class="create-member-form">
            <label>新帳號<input id="newUsername" pattern="[A-Za-z0-9._-]{3,32}" placeholder="例如 worker01" required /></label>
            <label>顯示名稱<input id="newDisplayName" required /></label>
            <label>初始密碼<input id="newPassword" type="password" minlength="8" required /></label>
            <button type="submit">建立會員</button>
        </form>
        <div id="adminMessage" role="status">載入中…</div>
        <div class="table-wrap"><table><thead><tr><th>顯示名稱</th><th>帳號</th><th>角色</th><th>狀態</th><th>建立時間</th><th>操作</th></tr></thead><tbody id="memberList"></tbody></table></div>
    </main>
    <script type="module" src="./js/admin.js"></script>
</body>
</html>
