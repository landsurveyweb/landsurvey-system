<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登入｜土地測量資料分享系統</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./css/auth.css" />
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <h1>土地測量資料分享系統</h1>
            <p>請使用管理員提供的帳號與密碼登入。</p>
            <form id="authForm">
                <label>帳號<input id="username" autocomplete="username" required /></label>
                <label>密碼<input id="password" type="password" minlength="8" autocomplete="current-password" required /></label>
                <button id="loginButton" type="submit">登入</button>
            </form>
            <div id="authMessage" role="status"></div>
        </section>
    </main>
    <script type="module" src="./js/login.js"></script>
</body>
</html>
